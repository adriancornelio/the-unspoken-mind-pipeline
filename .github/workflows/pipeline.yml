name: Unspoken Psychology — Content Pipeline

on:
  schedule:
    # Runs at 14:00 UTC every other day. Cron can't natively express "every 2 days",
    # so this uses day-of-month-is-even as a simple approximation — adjust as needed.
    - cron: '0 14 */2 * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab
  
permissions:
  contents: write

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (Remotion dependency)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pipeline (generate script + pick music + render)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MUSIC_FOLDER_ID: ${{ secrets.MUSIC_FOLDER_ID }}
        run: node scripts/run_pipeline.mjs

      - name: Upload rendered video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reel
          path: out/*.mp4
          retention-days: 14

      # Commit the updated state files (content/state.json, content/music_state.json)
      # so the next scheduled run knows where the rotation left off.
      - name: Commit rotation state
        run: |
          git config user.name "unspoken-mind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/state.json content/music_state.json content/script-*.json
          git diff --staged --quiet || git commit -m "chore: update content state [skip ci]"
          git push

      # - name: Upload to YouTube
      #   env:
      #     YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      #     YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      #     YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      #   run: node scripts/upload_youtube.mjs
